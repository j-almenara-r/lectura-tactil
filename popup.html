<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snap Scroll Settings</title>
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }
    
    .container {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    
    h1 {
      font-size: 18px;
      margin: 0 0 15px 0;
      color: #333;
    }
    
    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }
    
    .toggle-label {
      font-size: 14px;
      color: #666;
    }
    
    /* Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 24px;
    }
    
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.3s;
      border-radius: 24px;
    }
    
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }
    
    input:checked + .slider {
      background-color: #0078d4;
    }
    
    input:checked + .slider:before {
      transform: translateX(26px);
    }
    
    .description {
      font-size: 12px;
      color: #888;
      line-height: 1.5;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #eee;
    }
    
    .status {
      font-size: 12px;
      padding: 8px;
      border-radius: 4px;
      margin-top: 10px;
      text-align: center;
      display: none;
    }
    
    .status.success {
      background-color: #e7f5e7;
      color: #2d7a2d;
      display: block;
    }
    
    .keyboard-hint {
      font-size: 11px;
      color: #999;
      margin-top: 8px;
      padding: 8px;
      background: #f9f9f9;
      border-radius: 4px;
    }
    
    .keyboard-hint strong {
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Snap Scroll</h1>
    
    <div class="toggle-container">
      <span class="toggle-label">Enable Snap Scroll</span>
      <label class="switch">
        <input type="checkbox" id="snapScrollToggle">
        <span class="slider"></span>
      </label>
    </div>
    
    <div class="status" id="status">Settings saved!</div>
    
    <div class="description">
      Snap scroll makes it easier to navigate through web pages by automatically aligning content sections when you scroll.
    </div>
    
    <div class="keyboard-hint">
      <strong>Keyboard shortcuts:</strong><br>
      Space/PgDn: Next section<br>
      PgUp: Previous section
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
